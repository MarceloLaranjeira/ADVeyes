<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Eye/Lens icon -->
  <g transform="translate(4, 10)">
    <!-- Outer eye shape -->
    <ellipse cx="20" cy="20" rx="18" ry="12" stroke="#3B82F6" stroke-width="2.5" fill="none"/>
    <!-- Iris -->
    <circle cx="20" cy="20" r="7" fill="#3B82F6" opacity="0.15"/>
    <circle cx="20" cy="20" r="7" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
    <!-- Pupil -->
    <circle cx="20" cy="20" r="3.5" fill="#3B82F6"/>
    <!-- Gleam -->
    <circle cx="22.5" cy="17.5" r="1.2" fill="white" opacity="0.9"/>
    <!-- Scales of justice subtle lines -->
    <line x1="20" y1="28" x2="20" y2="33" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
    <line x1="14" y1="33" x2="26" y2="33" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
    <line x1="14" y1="33" x2="11" y2="36" stroke="#3B82F6" stroke-width="1.2" opacity="0.4"/>
    <line x1="26" y1="33" x2="29" y2="36" stroke="#3B82F6" stroke-width="1.2" opacity="0.4"/>
  </g>
  <!-- ADVeyes text -->
  <text x="52" y="34" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#0F172A" letter-spacing="-0.5">ADV</text>
  <text x="104" y="34" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#3B82F6" letter-spacing="-0.5">eyes</text>
  <!-- Tagline -->
  <text x="52" y="48" font-family="Inter, sans-serif" font-size="8" fill="#64748B" letter-spacing="2">GESTÃO JURÍDICA INTELIGENTE</text>
</svg>
