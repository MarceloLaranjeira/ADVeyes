  "https://adveyes.vercel.app/**",
  "https://*-automatikus-automacoes-projects.vercel.app/**",
  "http://localhost:8080/**",
  "http://localhost:5173/**",
  "http://localhost:55448/**",
  "http://localhost:49763/**",
